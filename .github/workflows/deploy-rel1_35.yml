name: Deploy MediaWiki 1.35 release

on:
  push:
    tags:
      - 'REL_1_35_*'

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-release.yml
    with:
      source_branch: REL1_35
      mediawiki_branch: REL1_35
      mediawiki_version: '1.35'
      php_version: '8.1'
      tag_prefix: REL_1_35_
    permissions:
      contents: write
